<style>
/* Layout: one narrow phone-first column; a red brigade band on top, a ceramic street plaque as the question card. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#15212C; --muted:#5A6774; --line:#D3DAE1;
  --brand:#C42A1C; --brand-ink:#FFFFFF; --cta:#15212C; --cta-ink:#FFFFFF;
  --plaque-bg:#FBFAF6; --plaque-ink:#1D4C8A; --plaque-rim:#1D4C8A; --plaque-sub:#3D4E60;
  --good:#1D7A47; --good-bg:#E3F3EA; --half:#9A6A0C; --half-bg:#FBF1DC; --bad:#B42318; --bad-bg:#FCE7E4;
  --p0:#2B63C6; --p1:#1E8A5A; --p2:#C77712; --p3:#8A44C2; --p4:#0F8C9A;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#18212A; --surface-2:#1E2933; --ink:#E7ECF1; --muted:#9AA7B3; --line:#2C3946;
  --brand:#D8402F; --brand-ink:#FFFFFF; --cta:#E7ECF1; --cta-ink:#0F151B;
  --plaque-bg:#F3F1EA; --plaque-ink:#1D4C8A; --plaque-rim:#3C6FB0;
  --good:#53C98A; --good-bg:#16352A; --half:#E2B24E; --half-bg:#3A2E14; --bad:#F2786A; --bad-bg:#3D1C19;
  --p0:#6C9BF0; --p1:#4CC08A; --p2:#E9A64A; --p3:#B587E8; --p4:#45BFCB;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#18212A; --surface-2:#1E2933; --ink:#E7ECF1; --muted:#9AA7B3; --line:#2C3946;
  --brand:#D8402F; --brand-ink:#FFFFFF; --cta:#E7ECF1; --cta-ink:#0F151B;
  --plaque-bg:#F3F1EA; --plaque-ink:#1D4C8A; --plaque-rim:#3C6FB0;
  --good:#53C98A; --good-bg:#16352A; --half:#E2B24E; --half-bg:#3A2E14; --bad:#F2786A; --bad-bg:#3D1C19;
  --p0:#6C9BF0; --p1:#4CC08A; --p2:#E9A64A; --p3:#B587E8; --p4:#45BFCB;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--p0);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Band */
.band{background:var(--brand);color:var(--brand-ink)}
.band .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:26px;font-weight:700;line-height:1;text-transform:uppercase}
.brand span{font-size:13px;opacity:.9}
.me-chip{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.18);border:0;border-radius:999px;padding:6px 12px 6px 6px;color:var(--brand-ink);font-weight:600;max-width:50%}
.me-chip .av{border:2px solid rgba(255,255,255,.7)}
.me-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:12px 4px 10px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
nav.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin-left:4px;vertical-align:middle}

main{padding-block:18px 48px}
section.view{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:12px 18px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;background:var(--cta);color:var(--cta-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.notice{border-left:4px solid var(--half);background:var(--half-bg);padding:10px 12px;border-radius:6px;font-size:14px}
.notice.bad{border-color:var(--bad);background:var(--bad-bg)}

/* Avatars */
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;color:#fff;flex:none}

/* Question */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);transition:width .25s}
.plaque{background:var(--plaque-bg);color:var(--plaque-ink);border:3px solid var(--plaque-rim);border-radius:14px;box-shadow:inset 0 0 0 4px var(--plaque-bg),inset 0 0 0 5.5px var(--plaque-rim);padding:22px 20px;text-align:center;min-height:132px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.plaque .kind{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.plaque .name{font-family:var(--display);font-weight:700;font-size:clamp(24px,6vw,34px);line-height:1.08;text-transform:uppercase;overflow-wrap:anywhere}
.plaque .info{font-size:14px;color:var(--plaque-sub);overflow-wrap:anywhere}
.pick{display:flex;flex-direction:column;gap:8px}
.pick .lab{display:flex;justify-content:space-between;align-items:baseline}
.parks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.park{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 2px 9px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.park i{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.park .k{position:absolute;top:3px;right:5px;font-size:10px;color:var(--muted);font-weight:500}
.park[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,var(--surface));box-shadow:inset 0 0 0 1.5px var(--pc)}
.park.ok{border-color:var(--good);background:var(--good-bg);box-shadow:inset 0 0 0 1.5px var(--good)}
.park.ko{border-color:var(--bad);background:var(--bad-bg);box-shadow:inset 0 0 0 1.5px var(--bad);text-decoration:line-through}
.park:disabled{cursor:default}
@media (max-width:420px){.park{font-size:13px}.park .k{display:none}}
.verdict{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:8px;font-weight:600}
.verdict.v1{background:var(--good-bg);color:var(--good)}
.verdict.v05{background:var(--half-bg);color:var(--half)}
.verdict.v0{background:var(--bad-bg);color:var(--bad)}
.verdict .pts{font-family:var(--display);font-size:24px}

/* Setup chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--cta);color:var(--cta-ink);border-color:var(--cta)}
.chip .c{font-weight:400;opacity:.7;margin-left:4px}

/* Tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl th:nth-child(-n+2){text-align:left}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl td:nth-child(-n+2){text-align:left}
.tbl tr.me td{background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.pos{font-family:var(--display);font-weight:700;font-size:20px;width:34px}
.pos.p1{color:var(--brand)}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.who .nm{display:flex;flex-direction:column;min-width:0}
.msg{font-size:13px;color:var(--muted);font-style:italic;white-space:normal;overflow-wrap:anywhere}
.crown{color:var(--brand);font-weight:700}
.feed{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.feed .ev{display:flex;gap:10px;align-items:center;font-size:14px}
.feed .ev>span:nth-child(2){flex:1;min-width:0}
.feed .t{font-size:12px;white-space:nowrap}
.mapbox{display:flex;flex-direction:column;gap:6px}
#qmap{height:230px;border-radius:10px;border:1px solid var(--line);z-index:0}
.maplinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
.maplinks a{color:var(--p0);font-weight:600}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.fcol{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.fcol i{display:block;width:70%;max-width:34px;background:var(--brand);border-radius:4px 4px 0 0;opacity:.85}
.fcol .num{font-size:16px;font-weight:700}
.pbars{display:flex;flex-direction:column;gap:12px}
.pbar{display:grid;grid-template-columns:96px 1fr 48px;gap:4px 10px;align-items:center}
.pbar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.pbar .track i{display:block;height:100%;border-radius:5px}
.pbar .num{font-weight:700;text-align:right;font-size:17px}
.pbar .sub{grid-column:2 / 4;font-size:12px}
.big{font-family:var(--display);font-weight:700;font-size:22px}
.scroll{overflow-x:auto}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--cta);color:var(--cta-ink)}
.mark{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;font-family:var(--display);font-weight:700;font-size:13px}
.mark.m1{background:var(--good-bg);color:var(--good)} .mark.m05{background:var(--half-bg);color:var(--half)} .mark.m0{background:var(--bad-bg);color:var(--bad)} .mark.mn{background:var(--surface-2);color:var(--muted)}
.duel td:first-child{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.status-list{display:flex;flex-direction:column;gap:8px}
.status-list .it{display:flex;align-items:center;gap:10px;justify-content:space-between}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.done{background:var(--good-bg);color:var(--good)}
.pill.going{background:var(--half-bg);color:var(--half)}
.fails{display:flex;flex-direction:column}
.fails .f{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.fails .f:last-child{border-bottom:0}
.fails .f span:first-child{min-width:0;overflow-wrap:anywhere}
.ans{display:inline-flex;gap:4px;flex:none;align-items:center;font-family:var(--display);font-weight:600;font-size:13px;text-transform:uppercase}
.ans i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--pc)}
.hero-score{display:flex;align-items:baseline;gap:8px}
.hero-score .num{font-size:56px;font-weight:700;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.stat .num{font-size:26px;font-weight:700;display:block}

/* Who are you */
.modal[hidden],[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.plist{display:flex;flex-direction:column;gap:6px}
.plist button{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;text-align:left;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
(() => {
"use strict";
const PARKS = ["NORTE","SUR","OESTE","CAMPANAR","SALER"];
const PSHORT = ["Norte","Sur","Oeste","Campanar","Saler"];
const BLOCKS = {C:"Calles",E:"Equipamientos",M:"Museos y monumentos",H:"Hospitales",G:"EGAs",P:"Puentes del Turia",J:"Parques y jardines"};
const BLOCK_ONE = {C:"Calle",E:"Equipamiento municipal",M:"Museo / monumento",H:"Hospital / centro",G:"EGA",P:"Puente del Turia",J:"Parque / jardín"};
const DAILY_MIX_V1 = [["C",5],["E",2],["M",1],["H",1],["G",1]];
const MIX_V2_FROM = "2026-10-15";
const PCOL = ["#C42A1C","#2B63C6","#1E8A5A","#C77712","#8A44C2","#0F8C9A","#B0336E","#4F5D6B"];
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (Math.round(n*10)/10).toLocaleString("es-ES",{maximumFractionDigits:1});
const fmtT = ms => { const s = Math.round(ms/1000); return s>=60 ? `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}` : `${s} s`; };
const ls = { get(k){ try{return localStorage.getItem(k);}catch{return null;} }, set(k,v){ try{localStorage.setItem(k,v);}catch{} } };

// ---------- dates (Europe/Madrid) ----------
const dfmt = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Madrid",year:"numeric",month:"2-digit",day:"2-digit"});
const today = () => dfmt.format(new Date());
const addDays = (ds, n) => { const d = new Date(ds+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const weekStart = ds => { const d = new Date(ds+"T12:00:00Z"); const wd = (d.getUTCDay()+6)%7; return addDays(ds,-wd); };
const longDate = ds => new Date(ds+"T12:00:00Z").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"});

// ---------- seeded RNG ----------
function hashStr(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return (h^=h>>>16)>>>0; }; }
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function sample(arr, n, rnd){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a.slice(0,n); }

// ---------- state ----------
let ITEMS = [], BYBLOCK = {};
const S = {
  view: (location.hash||"").replace("#","") || "hoy",
  db: null, user: null, uid: null, canWrite: true, writeError: null,
  pid: ls.get("cbl.pid"), players: {}, days: {}, subs: {}, loaded: false,
  quiz: null, rankRange: "semana", rankSort: "pts", champ: null,
  free: { blocks: new Set(["C"]), n: 10, parks: new Set([0,1,2,3,4]), addr: true },
};
if(!["hoy","libre","rank","fallos"].includes(S.view)) S.view = "hoy";

// ---------- scoring ----------
function scoreOf(item, sel){
  const [, , , p, a] = item;
  if(Array.isArray(p)){
    const s = sel.multi || new Set();
    const hit = p.filter(x=>s.has(x)).length;
    if(hit===p.length && s.size===p.length) return 1;
    return hit>0 ? 0.5 : 0;
  }
  if(a<0) return sel.p===p ? 1 : 0;
  if(sel.p!==p) return 0;
  return sel.a===a ? 1 : 0.5;
}
function dailyPlan(ds){
  const rnd = mulberry(hashStr("reto|"+ds)());
  let mix;
  if(ds < MIX_V2_FROM) mix = DAILY_MIX_V1;
  else { const ega = rnd() < 0.22; const hm = rnd() < 0.5 ? "H" : "M"; mix = ega ? [["C",6],[hm,1],["E",2],["G",1]] : [["C",7],[hm,1],["E",2]]; }
  const out = [];
  for(const [b,n] of mix) out.push(...sample(BYBLOCK[b]||[], n, rnd));
  return {mix, ids: sample(out, out.length, rnd)};
}
const dailyIds = ds => dailyPlan(ds).ids;
function mixText(mix){ const w={C:["calle","calles"],E:["equipamiento","equipamientos"],M:["museo o monumento","museos o monumentos"],H:["hospital","hospitales"],G:["EGA","EGAs"]}; const parts=mix.map(([b,n])=>`${n} ${w[b][n>1?1:0]}`); return parts.slice(0,-1).join(", ")+" y "+parts[parts.length-1]; }
function survBest(pid){ let m=0; const d=S.days[pid]||{}; for(const ds in d) m=Math.max(m,d[ds].sv?.best||0); return m; }
function survTop(){ let t=null; for(const p of playerList()){ const b=survBest(p.id); if(b>0&&(!t||b>t.best)) t={id:p.id,best:b}; } return t; }
function addSurv(d, run){ d.sv=d.sv||{best:0,runs:0}; d.sv.runs++; if(run>d.sv.best){ d.sv.best=run; d.sv.at=Date.now(); } }
function weekWinner(ws){
  const we = addDays(ws,6); let best=null;
  for(const p of playerList()){ let pts=0; const d=S.days[p.id]||{}; for(const ds in d) if(ds>=ws&&ds<=we) pts+=dayPts(d[ds]); if(pts>0 && (!best||pts>best.pts)) best={id:p.id,pts}; }
  return best;
}
function lastChampion(){ return weekWinner(addDays(weekStart(today()),-7)); }
function whoHTML(pid, msg){ const crown = S.champ===pid ? ` <span class="crown" title="Campeón de la semana pasada">♛</span>` : ""; return `<div class="who">${avatar(pid)}<span class="nm"><b>${esc(aliasOf(pid))}${crown}</b>${msg?`<span class="msg">“${esc(msg)}”</span>`:""}</span></div>`; }
function ago(t){ const m=Math.round((Date.now()-t)/60000); if(m<1) return "ahora"; if(m<60) return `hace ${m} min`; const hh=Math.round(m/60); if(hh<24) return `hace ${hh} h`; return `hace ${Math.round(hh/24)} d`; }

// ---------- persistence ----------
const myDays = () => S.days[S.pid] || (S.days[S.pid] = {});
const queue = new Map(); // path -> {busy, dirty}
async function flush(ds){
  if(!S.db || !S.pid || !S.canWrite) return;
  const key = ds; let q = queue.get(key);
  if(!q){ q = {busy:false,dirty:false}; queue.set(key,q); }
  if(q.busy){ q.dirty = true; return; }
  q.busy = true;
  try{
    do{
      q.dirty = false;
      const body = JSON.parse(JSON.stringify(myDays()[ds]));
      await S.db.doc(`players/${S.pid}/days/${ds}`).set(body);
    }while(q.dirty);
  }catch(e){ handleWriteError(e); }
  q.busy = false;
}
function mutateDay(ds, fn){
  const d = myDays()[ds] ? JSON.parse(JSON.stringify(myDays()[ds])) : {d:ds};
  fn(d); d.u = Date.now();
  myDays()[ds] = d;
  flush(ds);
}
function handleWriteError(e){
  try{ console.error("Error al guardar", e); }catch{}
  if(e && (e.code==="invalid_argument" || e.code==="not_granted" || e.code==="revoked")){
    S.canWrite = false;
    S.writeError = "No puedes guardar resultados con el acceso que tienes. Avisa a quien gestiona la liga.";
  } else if(e && e.code==="quota_exceeded"){
    S.writeError = "La base de datos está llena. Avisa a quien gestiona la página.";
  } else {
    S.writeError = "No se ha podido guardar el último resultado. Revisa la conexión; se volverá a intentar con la siguiente respuesta.";
  }
  render();
}
function recordOutcome(d, id, sc){
  d.o = d.o || {};
  if(sc<1) d.o[id] = 0;
  else if(pendingFails().has(id) || d.o[id]===0) d.o[id] = 1;
}

// ---------- derived ----------
function dayPts(doc){ return (doc?.dy?.pts||0) + (doc?.fr?.pts||0); }
function pendingFails(){
  const days = Object.keys(myDays()).sort();
  const set = new Set();
  for(const ds of days){ const o = myDays()[ds].o || {}; for(const k in o){ const id=+k; if(o[k]===0) set.add(id); else set.delete(id); } }
  return set;
}
function streak(pid){
  const d = S.days[pid]||{}; let ds = today(); let n = 0;
  if(!d[ds]?.dy?.done) ds = addDays(ds,-1);
  while(d[ds]?.dy?.done){ n++; ds = addDays(ds,-1); }
  return n;
}
function playerList(){ return Object.entries(S.players).map(([id,p])=>({id,...p})).sort((a,b)=>(a.since||0)-(b.since||0)); }
function colorOf(pid){ const ids = playerList().map(p=>p.id); const i = ids.indexOf(pid); return PCOL[(i<0?0:i)%PCOL.length]; }
function aliasOf(pid){ return S.players[pid]?.alias || "Jugador"; }
function avatar(pid){ const a = aliasOf(pid); return `<span class="av" style="background:${colorOf(pid)}">${esc(a.trim().charAt(0).toUpperCase()||"?")}</span>`; }

// ---------- rendering ----------
function setView(v){
  S.view = v;
  try{ history.replaceState(null,"","#"+v); }catch{}
  if(S.quiz && quizHome(S.quiz.mode)!==v) S.quiz = null;
  render(); window.scrollTo({top:0});
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.v)));

function quizHome(m){ return m==="daily"?"hoy":(m==="srs"||m==="fails")?"fallos":"libre"; }
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.setAttribute("aria-selected", String(b.dataset.v===S.view));
    const pending = (b.dataset.v==="hoy" && S.pid && ITEMS.length && !myDays()[today()]?.dy?.done) || (b.dataset.v==="fallos" && SRS.loaded && ITEMS.length && srsDueCount()>0);
    b.innerHTML = esc(b.textContent.replace(/\s+$/,"")) + (pending?'<span class="dot" aria-label="pendiente"></span>':"");
  });
  const chip = $("#meChip");
  if(S.pid && S.players[S.pid]){ chip.hidden=false; chip.innerHTML = avatar(S.pid)+`<span>${esc(aliasOf(S.pid))}</span>`; }
  else chip.hidden = true;
  const main = $("#main");
  if(!ITEMS.length) return;
  S.champ = lastChampion()?.id || null;
  ensureSrs();
  let html = "";
  if(S.writeError) html += `<div class="notice bad" role="alert">${esc(S.writeError)}</div>`;
  if(S.quiz && quizHome(S.quiz.mode)===S.view) html += quizHTML();
  else if(S.view==="hoy") html += hoyHTML();
  else if(S.view==="libre") html += libreHTML();
  else if(S.view==="rank") html += rankHTML();

  main.innerHTML = `<section class="view">${html}</section>`;
  bindView();
}

function freePool(){
  const f = S.free; const out = [];
  for(const b of f.blocks) for(const id of (BYBLOCK[b]||[])){

    if(Array.isArray(p) ? p.some(x=>f.parks.has(x)) : f.parks.has(p)) out.push(id);
  }
  return out;
}

// ----- RANKING -----
function rangeDays(r){
  const t = today();
  if(r==="hoy") return [t,t];
  if(r==="semana") return [weekStart(t), t];
  if(r==="mes") return [t.slice(0,8)+"01", t];
  return ["0000-00-00", t];
}
function rankHTML(){
  const [from,to] = rangeDays(S.rankRange);

  const rows = ps.map(p=>{
    const d = S.days[p.id]||{}; let pts=0, dpts=0, retos=0, n=0, ok=0, wins=0;
    for(const ds in d){ if(ds<from||ds>to) continue; const doc=d[ds];
      pts += dayPts(doc);
      if(doc.dy?.done){ retos++; dpts += doc.dy.pts; n += 10; ok += doc.dy.pts; }
      if(doc.fr){ n += doc.fr.n||0; ok += doc.fr.pts||0; }
    }

  }).sort((a,b)=> S.rankSort==="reto" ? (b.dpts-a.dpts || b.pts-a.pts) : S.rankSort==="acc" ? (((b.n>=30)-(a.n>=30)) || b.acc-a.acc) : (b.pts-a.pts || b.acc-a.acc));

  for(let ds=from<"2000"?earliestDay():from; ds<=to && ds<today(); ds=addDays(ds,1)){
    const w = ps.map(p=>({id:p.id,dy:S.days[p.id]?.[ds]?.dy})).filter(x=>x.dy?.done).sort((a,b)=>(b.dy.pts-a.dy.pts)||(a.dy.ms-b.dy.ms));

    <p class="muted" style="font-size:14px;margin:8px 0 12px">Puntos = reto diario + entreno libre. Los dos parques bien, 1 punto. Principal bien y apoyo mal, medio punto. Si fallas el principal, 0.</p><div class="row" style="margin-bottom:10px"><span class="eyebrow">Ordenar por</span><div class="seg" role="group">${[["pts","Puntos"],["reto","Reto"],["acc","Acierto"]].map(([k,l])=>`<button data-sort="${k}" aria-pressed="${S.rankSort===k}">${l}</button>`).join("")}</div></div>${S.rankSort==="acc"?`<p class="muted" style="font-size:13px;margin:0 0 10px">Para entrar en el orden por acierto hacen falta 30 preguntas en el periodo.</p>`:""}`;
  if(!rows.length) h += `<p class="muted">Aún no hay nadie en la liga. Elige tu nombre para estrenarla.</p>`;
  else{
    h += `<div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Jugador</th><th>Puntos</th><th>Pts reto</th><th>Acierto</th><th>Retos</th><th title="Retos diarios ganados (días cerrados)">Ganados</th><th title="Días seguidos haciendo el reto">Racha</th></tr></thead><tbody>`;
    rows.forEach((r,i)=>{
      h += `<tr class="${r.p.id===S.pid?"me":""}"><td class="pos ${i===0&&r.pts>0?"p1":""}">${i+1}</td><td>${whoHTML(r.p.id)}</td><td class="big">${fmt(r.pts)}</td><td>${fmt(r.dpts)}</td><td>${r.n?Math.round(r.acc*100)+" %":"–"}</td><td>${r.retos}</td><td>${winsBy[r.p.id]||0}</td><td>${r.streak?r.streak+" d":"–"}</td></tr>`;
    });
    h += `</tbody></table></div>`;
    const lead = rows[0], me = rows.find(r=>r.p.id===S.pid);
    if(me && lead && me!==lead && lead.pts>0) h += `<p style="margin:12px 0 0;font-size:14px">Te faltan <b>${fmt(lead.pts-me.pts)}</b> puntos para pillar a ${esc(lead.p.alias)}.</p>`;
    else if(me && me===lead && rows[1] && me.pts>0) h += `<p style="margin:12px 0 0;font-size:14px">Vas primero, con ${fmt(me.pts-rows[1].pts)} puntos de ventaja sobre ${esc(rows[1].p.alias)}.</p>`;
  }
  h += `</div>`;
  return h + recordsHTML();
}
function recordsHTML(){
  const ps = playerList(); if(!ps.length) return "";
  const titles = {}, history = [];
  const cur = weekStart(today()); let ws = weekStart(earliestDay());
  while(ws < cur){ const w = weekWinner(ws); if(w){ titles[w.id]=(titles[w.id]||0)+1; history.push({ws, ...w}); } ws = addDays(ws,7); }

const DAY0 = Date.UTC(2020,0,1);
const dnum = ds => Math.round((Date.parse(ds+"T00:00:00Z")-DAY0)/86400000);
const SRS = { loaded:false, c:{}, cfg:{n:10, b:["C"]}, nd:"", nn:0, sub:null, busy:false, dirty:false, timer:null, pidSub:null };
function srsGet(id){ const v=SRS.c[id]; if(!v) return null; const [d,iv,e,r,l]=String(v).split(",").map(Number); return {d,iv,e,r,l}; }
function srsPut(id,o){ SRS.c[id]=[o.d,o.iv,o.e,o.r,o.l].join(","); }
function srsRef(){ return S.db && S.pid ? S.db.doc(`players/${S.pid}/srs/main`) : null; }
function ensureSrs(){ if(S.db && S.pid && SRS.pidSub!==S.pid){ SRS.pidSub=S.pid; srsSubscribe(); } }
function srsSubscribe(){
  if(SRS.sub){ try{SRS.sub();}catch{} SRS.sub=null; }
  SRS.loaded=false; SRS.c={}; SRS.cfg={n:10,b:["C"]}; SRS.nd=""; SRS.nn=0;
  const ref=srsRef(); if(!ref) return;
  SRS.sub = ref.onSnapshot(snap=>{
    if(SRS.busy || SRS.dirty) return;
    const v = snap.exists ? snap.data() : null;
    if(v){ SRS.c={...(v.c||{})}; SRS.cfg={n:10,b:["C"],...(v.cfg||{})}; SRS.nd=v.nd||""; SRS.nn=v.nn||0; }

}
function srsSeed(){
  if(!SRS.loaded || !S.myDaysLoaded || SRS.cfg.s) return;
  const t=dnum(today());
  for(const id of pendingFails()) if(!srsGet(id)) srsPut(id,{d:t,iv:0,e:250,r:0,l:1});

}
function srsSave(){ SRS.dirty=true; clearTimeout(SRS.timer); SRS.timer=setTimeout(srsFlush, 800); }
async function srsFlush(){
  const ref=srsRef(); if(!ref || !S.canWrite){ SRS.dirty=false; return; }
  if(SRS.busy){ SRS.timer=setTimeout(srsFlush,500); return; }
  SRS.busy=true; SRS.dirty=false;
  try{ await ref.set({c:SRS.c, cfg:SRS.cfg, nd:SRS.nd, nn:SRS.nn, u:Date.now()}); }catch(e){ srsError(e); }
  SRS.busy=false;
}
function srsError(e){ try{console.error("Repaso",e);}catch{} S.writeError="No se ha podido guardar el repaso. En la web de GitHub, revisa que has pegado las reglas nuevas en Firebase (Firestore → Reglas)."; render(); }
function srsAnswer(id, sc, inRepaso){
  if(!SRS.loaded || !S.pid) return;

  if(!c){ if(!inRepaso && sc>=1) return; c={d:t,iv:0,e:250,r:0,l:0}; }
  else if(!inRepaso && sc>=1) return;
  if(sc>=1){ c.iv = c.r===0?1 : c.r===1?3 : Math.max(c.iv+1, Math.round(c.iv*c.e/100)); c.r++; }
  else if(sc>=0.5){ c.iv = Math.max(1, Math.round(c.iv*1.2)); c.e=Math.max(130,c.e-15); c.r++; }
  else { c.iv=1; c.e=Math.max(130,c.e-20); c.l++; c.r=0; }
  c.d = (!inRepaso && sc<1) ? t : t + c.iv;
  srsPut(id,c); srsSave();
}
function srsDue(){ const t=dnum(today()); const out=[]; for(const k in SRS.c){ const c=srsGet(k); if(c && c.d<=t) out.push([+k,c.d]); } out.sort((a,b)=>a[1]-b[1]); return out.map(x=>x[0]); }
function srsDueCount(){ const t=dnum(today()); let n=0; for(const k in SRS.c){ const d=parseInt(SRS.c[k],10); if(d<=t) n++; } return n; }
function srsNewLeft(){ const n=SRS.cfg.n||0; const used = SRS.nd===today()?SRS.nn:0; return Math.max(0,n-used); }
function srsNewPick(k){ if(k<=0) return []; const pool=[]; for(const b of (SRS.cfg.b||["C"])) for(const id of BYBLOCK[b]||[]) if(!SRS.c[id]) pool.push(id); return sample(pool,k,Math.random); }
function srsForecast(days){ const t=dnum(today()); let n=0; for(const k in SRS.c){ const d=parseInt(SRS.c[k],10); if(d===t+days) n++; } return n; }
function startSrs(){

}

    });
  }
  if(q.mode==="srs"){ if(!q.seen.has(id)){ q.seen.add(id); if(q.newSet.has(id)){ if(SRS.nd!==today()){ SRS.nd=today(); SRS.nn=0; } SRS.nn++; } srsAnswer(id, sc, true); } }
  else srsAnswer(id, sc, false);
  render();
}
function mapHTML(it){
  if(it.length<7) return "";
  const [lat,lng,approx] = [it[5],it[6],it[7]];
  const url = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
  return `<div class="mapbox">${window.L?`<div id="qmap" data-lat="${lat}" data-lng="${lng}" role="img" aria-label="Mapa de la ubicación"></div>`:""}<div class="maplinks"><span class="muted">${approx?"Punto aproximado: un punto de la calle, no el portal":"Ubicación de la calle"}</span><a href="${url}" target="_blank" rel="noopener">Abrir en Google Maps</a></div></div>`;
}
let MAP = null;
function drawMap(){
  if(MAP){ try{ MAP.remove(); }catch{} MAP = null; }
  const el = $("#qmap"); if(!el || !window.L) return;
  const ll = [+el.dataset.lat, +el.dataset.lng];
  MAP = L.map(el, {scrollWheelZoom:false, attributionControl:true}).setView(ll, 15);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(MAP);
  L.circleMarker(ll, {radius:9, color:"#fff", weight:3, fillColor:"#C42A1C", fillOpacity:1}).addTo(MAP);
}
function next(){ const q=S.quiz; if(q.mode==="srs" && q.results.length && q.results[q.results.length-1].sc<1 && !q.req.has(q.ids[q.i])){ q.req.add(q.ids[q.i]); q.ids.push(q.ids[q.i]); } if(q.mode==="surv" && q.results.length && q.results[q.results.length-1].sc<1){ q.i=q.ids.length; q.answered=false; render(); return; } q.i++; q.answered=false; q.sel={p:null,a:null,multi:new Set()}; q.t0=performance.now(); render(); }

function bindView(){
  const on = (sel, fn) => { const el=$(sel); if(el) el.addEventListener("click", fn); };
  on("#startDaily", ()=>{ if(!S.pid && S.db && S.canWrite) return askWho(); startQuiz("daily", dailyIds(today())); });
  on("#startFree", ()=>{ if(!S.pid && S.db && S.canWrite) return askWho(); const pool=freePool(); startQuiz("free", sample(pool, Math.min(S.free.n,pool.length), Math.random)); });
  on("#startFails", ()=>{ const s=[...pendingFails()]; startQuiz("fails", sample(s, Math.min(20,s.length), Math.random)); });
  on("#nextQ", next);
  on("#startSrs", startSrs);
  on("#trainWeak", e=>{ const k=+e.currentTarget.dataset.weak; const pool=[]; for(const b of ["C","E"]) for(const id of BYBLOCK[b]||[]) if(ITEMS[id][3]===k) pool.push(id); S.view="libre"; startQuiz("free", sample(pool, Math.min(20,pool.length), Math.random)); });
  document.querySelectorAll("[data-srsn]").forEach(b=>b.addEventListener("click",()=>{ SRS.cfg.n=+b.dataset.srsn; srsSave(); render(); }));
  document.querySelectorAll("[data-srsb]").forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.srsb; let a=(SRS.cfg.b||[]).slice(); a=a.includes(k)?a.filter(x=>x!==k):a.concat(k); if(!a.length) a=[k]; SRS.cfg.b=a; srsSave(); render(); }));
  drawMap();
  on("#addrT", ()=>{ S.free.addr = !S.free.addr; render(); });
  on("#quitQ", ()=>{ const q=S.quiz; if(q.mode==="surv" && q.results.length && S.db && S.pid) mutateDay(today(), d=>addSurv(d, q.results.length)); S.quiz=null; render(); });
  on("#startSurv", ()=>{ if(!S.pid && S.db && S.canWrite) return askWho(); startQuiz("surv", sample(BYBLOCK.C, 400, Math.random)); });
  document.querySelectorAll("[data-sort]").forEach(b=>b.addEventListener("click",()=>{ S.rankSort=b.dataset.sort; render(); }));
  const mf=$("#msgForm"); if(mf) mf.addEventListener("submit", e=>{ e.preventDefault(); const v=$("#msgIn").value.trim().slice(0,80); mutateDay(today(), d=>{ if(d.dy) d.dy.msg=v; }); render(); });
  on("#closeQ", ()=>{ S.quiz=null; render(); });
  on("#again", ()=>{ const m=S.quiz.mode; S.quiz=null; if(m==="surv") return startQuiz("surv", sample(BYBLOCK.C, 400, Math.random)); if(m==="srs") return startSrs(); if(m==="fails"){ const s=[...pendingFails()]; if(s.length) return startQuiz("fails", sample(s,Math.min(20,s.length),Math.random)); render(); } else { const pool=freePool(); startQuiz("free", sample(pool, Math.min(S.free.n,pool.length), Math.random)); } });
  on("#seeRank", ()=>{ S.quiz=null; S.rankRange="hoy"; render(); });
  on("#checkMulti", answer);
  document.querySelectorAll(".park").forEach(b=>b.addEventListener("click",()=>pickPark(b.dataset.row, +b.dataset.i)));
  document.querySelectorAll("[data-block]").forEach(b=>b.addEventListener("click",()=>{ const s=S.free.blocks; const k=b.dataset.block; s.has(k)?s.delete(k):s.add(k); if(!s.size) s.add(k); render(); }));
  document.querySelectorAll("[data-park]").forEach(b=>b.addEventListener("click",()=>{ const s=S.free.parks; const k=+b.dataset.park; s.has(k)?s.delete(k):s.add(k); if(!s.size) s.add(k); render(); }));
  document.querySelectorAll("[data-n]").forEach(b=>b.addEventListener("click",()=>{ S.free.n=+b.dataset.n; render(); }));
  document.querySelectorAll("[data-range]").forEach(b=>b.addEventListener("click",()=>{ S.rankRange=b.dataset.range; render(); }));
}
function pickPark(row, i){
  const q = S.quiz; if(!q || q.answered) return;
  const it = ITEMS[q.ids[q.i]];
  if(row==="multi"){ q.sel.multi.has(i)?q.sel.multi.delete(i):q.sel.multi.add(i); render(); return; }
  q.sel[row] = i;
  const hasA = it[4]>=0;
  if(q.sel.p!=null && (!hasA || q.sel.a!=null)) answer(); else render();
}
document.addEventListener("keydown", e=>{
  const q = S.quiz; if(!q || q.i>=q.ids.length || e.target.tagName==="INPUT") return;
  const it = ITEMS[q.ids[q.i]];
  if(e.key==="Enter"){ if(q.answered){ e.preventDefault(); next(); } else if(Array.isArray(it[3]) && q.sel.multi.size){ e.preventDefault(); answer(); } return; }
  const n = parseInt(e.key,10); if(!(n>=1&&n<=5) || q.answered) return;
  if(Array.isArray(it[3])) return pickPark("multi", n-1);
  pickPark(q.sel.p==null || it[4]<0 ? "p" : "a", n-1);
});

// ---------- who are you ----------
function askWho(){
  const m = $("#modal"); const ps = playerList();
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="whoT"><h2 id="whoT" style="font-size:28px">¿Quién eres?</h2>
    ${ps.length?`<div><div class="eyebrow" style="margin-bottom:8px">Ya en la liga</div><div class="plist">${ps.map(p=>`<button data-claim="${esc(p.id)}">${avatar(p.id)}${esc(p.alias)}</button>`).join("")}</div></div>`:""}
    <form id="newP" style="display:flex;flex-direction:column;gap:8px"><label class="eyebrow" for="alias">${ps.length?"O entra como nuevo":"Tu nombre en la liga"}</label>
    <input class="input" id="alias" maxlength="20" autocomplete="nickname" placeholder="Ej.: Bro" required>
    <button class="btn" type="submit">Entrar en la liga</button></form>
    ${S.pid?`<button class="btn ghost small" id="closeWho">Cancelar</button>`:""}</div>`;
  m.hidden = false;
  m.querySelectorAll("[data-claim]").forEach(b=>b.addEventListener("click",()=>claim(b.dataset.claim)));
  $("#newP").addEventListener("submit", async e=>{ e.preventDefault(); const a=$("#alias").value.trim().slice(0,20); if(a) await createPlayer(a); });
  const c=$("#closeWho"); if(c) c.addEventListener("click",()=>{ m.hidden=true; });
}
async function claim(pid){
  S.pid = pid; ls.set("cbl.pid", pid); $("#modal").hidden = true;
  if(S.uid && S.players[pid] && S.players[pid].uid!==S.uid && S.canWrite){
    try{ await S.db.doc("players/"+pid).set({...S.players[pid], uid:S.uid}); }catch(e){ handleWriteError(e); }
  }
  render();
}
async function createPlayer(alias){
  const ref = S.db.collection("players").doc();
  const body = {alias, since:Date.now(), uid:S.uid||null};
  try{ await ref.set(body); S.players[ref.id] = body; S.days[ref.id] = S.days[ref.id]||{}; subscribeDays(ref.id); claim(ref.id); }
  catch(e){ $("#modal").hidden = true; handleWriteError(e); }
}
$("#meChip").addEventListener("click", ()=>{ if(S.db) askWho(); });

// ---------- db wiring ----------
function subscribeDays(pid){
  if(S.subs[pid] || !S.db) return;
  S.subs[pid] = S.db.collection(`players/${pid}/days`).orderBy("d","desc").limit(120).onSnapshot(snap=>{
    const local = S.days[pid] || {};
    const next = {};
    for(const doc of snap.docs){ const data = doc.data(); if(!data) continue;
      const mine = pid===S.pid && local[doc.id] && (local[doc.id].u||0) > (data.u||0);
      next[doc.id] = mine ? local[doc.id] : data;
    }
    if(pid===S.pid) for(const ds in local) if(!next[ds]) next[ds] = local[ds];
    S.days[pid] = next;
    if(pid===S.pid){ S.myDaysLoaded = true; srsSeed(); }
    if(!S.quiz || S.view==="rank") render(); else updateLightly();
  }, ()=>{});
}
function updateLightly(){ /* during a quiz avoid re-rendering the board */ }
async function initDb(){
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  S.db = db; S.user = user; S.dbChecked = true;
  if(user){ try{ S.uid = await user.id(); }catch{} try{ const c = await user.can("data.write"); if(c===false){ S.canWrite=false; S.writeError="Tienes acceso de solo lectura: ves el ranking pero no puedes jugar en la liga. "; } }catch{} }
  if(!db){ render(); return; }
  db.collection("players").onSnapshot(snap=>{
    const ps = {};
    for(const d of snap.docs){ const v=d.data(); if(v && v.alias) ps[d.id] = v; }
    S.players = ps;
    for(const id in ps) subscribeDays(id);
    if(!S.pid && S.uid){ const hit = Object.entries(ps).find(([,v])=>v.uid===S.uid); if(hit){ S.pid=hit[0]; ls.set("cbl.pid",hit[0]); } }
    if(S.pid && !ps[S.pid] && snap.metadata && !snap.metadata.fromCache){ S.pid=null; }
    if(!S.loaded){ S.loaded = true; if(!S.pid && S.canWrite) askWho(); }
    if(!S.quiz) render();
  }, ()=>{ render(); });
}

// ---------- boot ----------
fetch("data.json").then(r=>r.json()).then(data=>{
  ITEMS = data.items; BYBLOCK = {};
  ITEMS.forEach((it,i)=>{ (BYBLOCK[it[0]] ||= []).push(i); });
  render();
  if(window.claude && typeof window.claude.use==="function") initDb().catch(()=>{ S.dbChecked=true; render(); });
  else { S.dbChecked = true; render(); }
}).catch(()=>{ $("#main").innerHTML = `<section class="view"><div class="notice bad">No se han podido cargar los datos del callejero. Recarga la página.</div></section>`; });
})();
</script>
